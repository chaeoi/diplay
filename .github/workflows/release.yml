name: Build and Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew :mobile:assembleDebug --stacktrace

      - name: Prepare Release Artifacts and Detailed Changelog
        id: prep
        run: |
          mkdir -p release-artifacts
          APK_FILE="release-artifacts/diplay-v0.1.0-debug.apk"
          cp mobile/build/outputs/apk/debug/*.apk "$APK_FILE"

          cd release-artifacts
          sha256sum diplay-v0.1.0-debug.apk > sha256sum.txt
          cd ..

          python3 scripts/generate_release_notes.py

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-preview
          name: "DiPlay v0.1.0 通用车机定制版 (Snapshot)"
          body_path: release_body.md
          files: |
            release-artifacts/diplay-v0.1.0-debug.apk
            release-artifacts/sha256sum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
